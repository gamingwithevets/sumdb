<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Casio Calculator Version Database</title>
	<style>
		:root {
			--accent: #00ffcc;
			--bg: #0f0f0f;
			--card: #181818;
			--text: #ececec;
			--border: #2a2a2a;
		}
		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background-color: var(--bg);
			color: var(--text);
			margin: 0;
			padding: 40px 20px;
		}
		.container { max-width: 1200px; margin: 0 auto; }
		header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
		h1 { color: var(--accent); margin: 0; font-size: 24px; letter-spacing: -0.5px; }
		
		.discord-callout {
			margin-bottom: 20px;
			font-size: 15px;
			color: var(--text);
		}
		.discord-callout a {
			color: var(--accent);
			text-decoration: none;
			font-weight: bold;
			border-bottom: 1px dashed var(--accent);
		}
		.discord-callout a:hover {
			border-bottom-style: solid;
		}
	</style>
</head>
<body>

<div class="container">
	<header>
		<div>
			<h1>Casio Calculator Version Database</h1>
			<div id="status" style="font-size: 12px; color: #555; margin-top: 5px;">Loading database...</div>
		</div>
	</header>

	<p class="discord-callout">
		<b>We've moved!</b> This site has been migrated to <a href="https://gwetm.codeberg.page/sumdb/">Codeberg</a>.
	</p>
</div>

</body>
</html>
