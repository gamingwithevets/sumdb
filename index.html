<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Casio Calculator Version Database</title>
	<style>
		:root {
			--accent: #00ffcc;
			--bg: #0f0f0f;
			--card: #181818;
			--text: #ececec;
			--border: #2a2a2a;
		}
		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background-color: var(--bg);
			color: var(--text);
			margin: 0;
			padding: 40px 20px;
		}
		.container { max-width: 1200px; margin: 0 auto; }
		header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
		h1 { color: var(--accent); margin: 0; font-size: 24px; letter-spacing: -0.5px; }
		
		.controls {
			display: grid;
			grid-template-columns: 2fr 1fr;
			gap: 20px;
			margin-bottom: 25px;
		}
		.search-bar, .sort-select {
			padding: 12px 16px;
			border-radius: 8px;
			border: 1px solid var(--border);
			background: var(--card);
			color: white;
			font-size: 15px;
			outline: none;
		}
		.search-bar:focus { border-color: var(--accent); }
		
		table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
			background: var(--card);
			border-radius: 12px;
			border: 1px solid var(--border);
			overflow: hidden;
		}
		th { background: #222; color: #888; padding: 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
		td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
		tr:last-child td { border-bottom: none; }
		tr:hover { background: #202020; }

		.ver-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; color: #fff; }
		.prefix { color: #666; font-weight: 400; }
		.model-name { font-weight: 500; }
		.revision-box { margin-bottom: 8px; padding: 10px; background: #222; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
		.rev-ey { border-left-color: #3498db; }
		.rev-standard { border-left-color: #95a5a6; }
		
		.chk-hex { font-family: monospace; color: var(--accent); background: #002211; padding: 3px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #004422; }
		.badge-pre { background: #e67e22; color: #000; font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-left: 8px; }
		
		.no-data { text-align: center; padding: 40px; color: #666; }
	</style>
</head>
<body>

<div class="container">
	<header>
		<div>
			<h1>Casio Calculator Version Database</h1>
			<div id="status" style="font-size: 12px; color: #555; margin-top: 5px;">Loading database...</div>
		</div>
	</header>

	<div class="controls">
		<input type="text" id="searchBar" class="search-bar" placeholder="Filter by model, version, or checksum..." onkeyup="processData()">
		<select id="sortSelect" class="sort-select" onchange="processData()">
			<option value="code">Sort by Version Code</option>
			<option value="model">Sort by Model Name</option>
			<option value="hwid">Sort by Prefix</option>
		</select>
	</div>

	<table id="mainTable">
		<thead>
			<tr>
				<th style="width: 20%;">Version Code</th>
				<th style="width: 35%;">Model Identity</th>
				<th>Revision Details & Integrity</th>
			</tr>
		</thead>
		<tbody id="tableBody"></tbody>
	</table>

	<p>
		I just asked Google Gemini to whip this up and after 10 minutes I got this result lmao. Good enough I guess.
		<br><br>
		Database content from <a href="https://gwe.dpdns.org/calcupedia/Calculator_self-test">Calcupedia</a><br>© 2026 GamingWithEvets Inc.
	</p>
</div>

<script>
	const HWID_MAP = { 1: "AY", 2: "GY", 3: "LY", 4: "CY", 5: "EY", 6: "FY" };
	let rawData = {};

	async function fetchData() {
		try {
			const response = await fetch(`checksums.json?${Date.now()}`);
			rawData = await response.json();
			document.getElementById('status').innerText = `Loaded ${Object.keys(rawData).length} records`;
			processData();
		} catch (e) {
			document.getElementById('status').innerText = "Could not load database: " + e;
			document.getElementById('status').style.color = "#ff4444";
			console.error(e);
		}
	}

	function processData() {
		const tbody = document.getElementById('tableBody');
		const query = document.getElementById('searchBar').value.toLowerCase();
		const sortBy = document.getElementById('sortSelect').value;
		
		tbody.innerHTML = '';

		let entries = Object.entries(rawData).map(([key, val]) => ({ key, ...val }));

		// Search Filter
		entries = entries.filter(e => {
			const modelMatch = (e.model || "").toLowerCase().includes(query);
			const keyMatch = e.key.toLowerCase().includes(query);
			const prefix = HWID_MAP[e.hwid] || "";
			const fullMatch = (prefix + e.key).toLowerCase().includes(query);
			return modelMatch || keyMatch || fullMatch;
		});

		// Sort Logic
		entries.sort((a, b) => {
			if (sortBy === 'model') return (a.model || "").localeCompare(b.model || "");
			if (sortBy === 'hwid') return (a.hwid || 0) - (b.hwid || 0);
			return a.key.localeCompare(b.key, undefined, {numeric: true});
		});

		if (entries.length === 0) {
			tbody.innerHTML = '<tr><td colspan="3" class="no-data">No results found in database.</td></tr>';
			return;
		}

		entries.forEach(item => {
			const row = document.createElement('tr');
			const prefix = HWID_MAP[item.hwid] || "ROM ";
			
			let checkContent = "";
			if (typeof item.checksums !== 'undefined') {
				Object.entries(item.checksums).forEach(([rev, info]) => {
					if (typeof info === 'string') {
						checkContent += `
							<div class="revision-box rev-standard">
								<span><b>${rev}</b>: ${info}</span>
							</div>`;
					} else {
						const isX = info.x === true;
						const vString = `${prefix}${isX ? '' : '-'}${item.key}${isX ? 'X' : ''}`;
						const preBadge = info.z ? `<span class="badge-pre">PRE-RELEASE</span>` : "";
						
						// Formatting Revision Text based on Prefix
						let revDisplay = "";
						if (["EY", "FY"].includes(prefix)) {
							revDisplay = !info.w ? `V.<b>${rev}</b>` : `Ver<b>${rev}</b>`;
						} else if (["AY", "GY", "LY", "CY"].includes(prefix)) {
							revDisplay = `Ver<b>${rev}</b>`;
						} else {
							revDisplay = rev;
						}

						const checksumDisplay = info.y ? `<span class="chk-hex">${info.y}</span>` : "";
						const boxClass = ["EY", "FY"].includes(prefix) && !info.w ? "rev-ey" : "rev-standard";
						
						checkContent += `
							<div class="revision-box ${boxClass}">
								<span>${revDisplay} <small style="color:#666; margin-left:8px;">[${vString}]</small> ${preBadge}</span>
								${checksumDisplay}
							</div>`;
					}
				});

			} else checkContent += `No data.`
			const code = item.key.includes("ES") ? item.key.slice(2) : item.key; 
			row.innerHTML = `
				<td><span class="ver-code"><span class="prefix">${prefix}</span>${code}</span></td>
				<td><span class="model-name">${item.model || 'P mode model'}</span></td>
				<td>${checkContent}</td>
			`;
			tbody.appendChild(row);
		});
	}

	window.onload = fetchData;
</script>

</body>
</html>
