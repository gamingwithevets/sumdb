<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Casio Calculator Version Database</title>
	<style>
		:root {
			--accent: #00ffcc;
			--bg: #0f0f0f;
			--card: #181818;
			--text: #ececec;
			--border: #2a2a2a;
		}
		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background-color: var(--bg);
			color: var(--text);
			margin: 0;
			padding: 40px 20px;
		}
		.container { max-width: 1200px; margin: 0 auto; }
		header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
		h1 { color: var(--accent); margin: 0; font-size: 24px; letter-spacing: -0.5px; }
		
		.controls {
			display: grid;
			grid-template-columns: 2fr 1fr;
			gap: 20px;
			margin-bottom: 25px;
		}
		.search-bar, .sort-select {
			padding: 12px 16px;
			border-radius: 8px;
			border: 1px solid var(--border);
			background: var(--card);
			color: white;
			font-size: 15px;
			outline: none;
		}
		.search-bar:focus { border-color: var(--accent); }
		
		table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
			background: var(--card);
			border-radius: 12px;
			border: 1px solid var(--border);
			overflow: hidden;
		}
		th { background: #222; color: #888; padding: 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
		td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
		tr:last-child td { border-bottom: none; }
		tr:hover { background: #202020; }

		.ver-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; color: #fff; }
		.prefix { color: #666; font-weight: 400; }
		.model-name { font-weight: 400; display: block; }
		.revision-box { margin-bottom: 8px; padding: 10px; background: #222; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
		.rev-ey { border-left-color: #3498db; }
		.rev-standard { border-left-color: #95a5a6; }
		
		.chk-hex { font-family: monospace; color: var(--accent); background: #002211; padding: 3px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #004422; }
		.badge-pre { background: #e67e22; color: #000; font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-left: 8px; }
		
		.no-data { text-align: center; padding: 40px; color: #666; }
		mark { background: var(--accent); color: #000; border-radius: 2px; padding: 0 2px; }
		
		ul.rev-model-list { margin: 0; padding-left: 16px; }
		ul.rev-model-list li { margin-bottom: 2px; }
		.pre-label { margin-top: 8px; font-size: 13px; color: #888; }
	</style>
</head>
<body>

<div class="container">
	<header>
		<div>
			<h1>Casio Calculator Version Database</h1>
			<div id="status" style="font-size: 12px; color: #555; margin-top: 5px;">Loading database...</div>
		</div>
	</header>

	<div class="controls">
		<input type="text" id="searchBar" class="search-bar" placeholder="Filter by model, version, or checksum..." onkeyup="processData()">
		<select id="sortSelect" class="sort-select" onchange="processData()">
			<option value="code">Sort by Version Code</option>
			<option value="model">Sort by Model Name</option>
			<option value="hwid">Sort by Prefix</option>
		</select>
	</div>

	<table id="mainTable">
		<thead>
			<tr>
				<th style="width: 20%;">Version Code</th>
				<th style="width: 35%;">Model Identity</th>
				<th>Revision Details & Integrity</th>
			</tr>
		</thead>
		<tbody id="tableBody"></tbody>
	</table>

	<p>
		Database content from <a href="https://gwe.dpdns.org/calcupedia/Calculator_self-test">Calcupedia</a> and various other sources.<br>© 2026 GamingWithEvets Inc.
	</p>
</div>

<script>
	const HWID_MAP = { 1: "AY", 2: "GY", 3: "LY", 4: "CY", 5: "EY", 6: "FY" };
	let rawData = {};

	async function fetchData() {
		try {
			const response = await fetch(`checksums.json?${Date.now()}`);
			rawData = await response.json();
			document.getElementById('status').innerText = `Loaded ${Object.keys(rawData).length} records`;
			processData();
		} catch (e) {
			document.getElementById('status').innerText = "Could not load database: " + e;
			document.getElementById('status').style.color = "#ff4444";
			console.error(e);
		}
	}

	function processData() {
		const tbody = document.getElementById('tableBody');
		const query = document.getElementById('searchBar').value.toLowerCase();
		const sortBy = document.getElementById('sortSelect').value;
		
		tbody.innerHTML = '';

		let entries = Object.entries(rawData).map(([key, val]) => ({ key, ...val }));

		entries = entries.filter(e => {
			let modelNames = [];
			if (Array.isArray(e.model)) {
				modelNames = e.model.map(m => m.name || "");
			}
			if (Array.isArray(e.prenames)) {
				modelNames = modelNames.concat(e.prenames.map(p => p.name || ""));
			}
			
			let modelMatch = modelNames.some(name => name.toLowerCase().includes(query));
			if (!e.model || e.model.length === 0) {
				if ("P mode model".toLowerCase().includes(query)) {
					modelMatch = true;
				}
			}
			
			const keyMatch = e.key.toLowerCase().includes(query);
			const prefix = HWID_MAP[e.hwid] || "ROM ";
			const fullMatch = (prefix + e.key).toLowerCase().includes(query);
			
			let revisionMatch = false;
			if (e.checksums) {
				Object.entries(e.checksums).forEach(([rev, info]) => {
					if (rev.toLowerCase().includes(query)) {
						revisionMatch = true;
					}
					
					if (Array.isArray(info)) {
						info.forEach(innerItem => {
							if (innerItem.name && innerItem.name.toLowerCase().includes(query)) {
								revisionMatch = true;
							}
						});
					} else {
						if (info.y && info.y.toLowerCase().includes(query)) {
							revisionMatch = true;
						}
						const isX = info.x === true;
						const vString = `${prefix}${isX ? '' : '-'}${e.key}${isX ? 'X' : ''}`;
						if (vString.toLowerCase().includes(query)) {
							revisionMatch = true;
						}
					}
				});
			}
			
			return modelMatch || keyMatch || fullMatch || revisionMatch;
		});

		entries.sort((a, b) => {
			const prefixA = HWID_MAP[a.hwid] || "ROM ";
			const prefixB = HWID_MAP[b.hwid] || "ROM ";
			
			if (prefixA === "ROM " && prefixB !== "ROM ") return -1;
			if (prefixB === "ROM " && prefixA !== "ROM ") return 1;

			if (sortBy === 'model') {
				const modelA = Array.isArray(a.model) && a.model[0] ? a.model[0].name : "P mode model";
				const modelB = Array.isArray(b.model) && b.model[0] ? b.model[0].name : "P mode model";
				return modelA.localeCompare(modelB);
			}
			if (sortBy === 'hwid') return (a.hwid || 0) - (b.hwid || 0);
			return a.key.localeCompare(b.key, undefined, {numeric: true});
		});

		if (entries.length === 0) {
			tbody.innerHTML = '<tr><td colspan="3" class="no-data">No results found in database.</td></tr>';
			return;
		}

		entries.forEach(item => {
			const row = document.createElement('tr');
			const prefix = HWID_MAP[item.hwid] || "ROM ";
			
			let checkContent = "";
			if (typeof item.checksums !== 'undefined') {
				Object.entries(item.checksums).forEach(([rev, info]) => {
					if (Array.isArray(info)) {
						let subModelsContent = "";
						let separator = ":<br>";
						
						let processedInfo = info.map(inf => {
							let nameText = inf.name || "";
							let noteText = inf.note || "";
							if (noteText) {
								noteText = noteText.trim();
								if (!noteText.startsWith('(') || !noteText.endsWith(')')) {
									noteText = `(${noteText})`;
								}
							}
							if (query) {
								const escapeRegex = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
								const regex = new RegExp(`(${escapeRegex})`, "gi");
								if (nameText.toLowerCase().includes(query)) nameText = nameText.replace(regex, "<mark>$1</mark>");
							}
							return `${nameText}${noteText ? ` <small style="color:#888">${noteText}</small>` : ''}`;
						});

						if (processedInfo.length === 1) {
							subModelsContent = processedInfo[0];
							separator = ": ";
						} else if (processedInfo.length >= 2) {
							subModelsContent = `<ul class="rev-model-list">`;
							processedInfo.forEach(html => {
								subModelsContent += `<li>${html}</li>`;
							});
							subModelsContent += `</ul>`;
						}
						
						checkContent += `
							<div class="revision-box rev-standard">
								<span><b>${rev}</b>${separator}${subModelsContent}</span>
							</div>`;
					} else {
						const isX = info.x === true;
						const vString = `${prefix}${isX ? '' : '-'}${item.key}${isX ? 'X' : ''}`;
						const preBadge = info.z ? `<span class="badge-pre">PRE-RELEASE</span>` : "";
						
						let revDisplay = "";
						if (["EY", "FY"].includes(prefix)) {
							revDisplay = !info.w ? `V.<b>${rev}</b>` : `Ver<b>${rev}</b>`;
						} else if (["AY", "GY", "LY", "CY"].includes(prefix)) {
							revDisplay = `Ver<b>${rev}</b>`;
						} else {
							revDisplay = rev;
						}

						const checksumDisplay = info.y ? `<span class="chk-hex">${info.y}</span>` : "";
						const boxClass = ["EY", "FY"].includes(prefix) && !info.w ? "rev-ey" : "rev-standard";
						
						checkContent += `
							<div class="revision-box ${boxClass}">
								<span>${revDisplay} <small style="color:#666; margin-left:8px;">[${vString}]</small> ${preBadge}</span>
								${checksumDisplay}
							</div>`;
					}
				});

			} else checkContent += `No data.`
			
			let displayModelHtml = "";
			if (Array.isArray(item.model) && item.model.length > 0) {
				if (item.model.length === 1) {
					displayModelHtml = `<span class="model-name">${item.model[0].name}</span>`;
				} else {
					displayModelHtml = `<ul class="rev-model-list">`;
					item.model.forEach(m => {
						displayModelHtml += `<li><span class="model-name">${m.name}</span></li>`;
					});
					displayModelHtml += `</ul>`;
				}
			} else {
				let baseText = "P mode model";
				if (query && baseText.toLowerCase().includes(query)) {
					const escapeRegex = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
					const regex = new RegExp(`(${escapeRegex})`, "gi");
					baseText = baseText.replace(regex, "<mark>$1</mark>");
				}
				displayModelHtml = `<span class="model-name">${baseText}</span>`;
			}

			if (Array.isArray(item.prenames) && item.prenames.length > 0) {
				displayModelHtml += `<div class="pre-label">Pre-release names:</div>`;
				if (item.prenames.length === 1) {
					displayModelHtml += `<span class="model-name" style="color: #bbb;">${item.prenames[0].name}</span>`;
				} else {
					displayModelHtml += `<ul class="rev-model-list" style="color: #bbb;">`;
					item.prenames.forEach(p => {
						displayModelHtml += `<li><span class="model-name">${p.name}</span></li>`;
					});
					displayModelHtml += `</ul>`;
				}
			}
			
			const code = item.key.includes("ES") ? item.key.slice(2) : item.key; 
			row.innerHTML = `
				<td><span class="ver-code"><span class="prefix">${prefix}</span>${code}</span></td>
				<td>${displayModelHtml}</td>
				<td>${checkContent}</td>
			`;
			tbody.appendChild(row);
		});
	}

	window.onload = fetchData;
</script>

</body>
</html>
